[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ['npm install --legacy-peer-deps']

[phases.build]
cmds = ['npm run build']

[start]
cmd = 'npm run start:prod'

[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_ENV = "production"
# Optimized for memory efficiency during build/start
NODE_OPTIONS = "--max-old-space-size=1024"